services:
  postgres:
    image: postgres:15-alpine
    container_name: twe-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: twe_user
      POSTGRES_PASSWORD: twe_password
      POSTGRES_DB: twe_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twe_user -d twe_db']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:15-alpine
    container_name: twe-postgres-test
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: twe_test
      POSTGRES_PASSWORD: twe_password
      POSTGRES_DB: twe_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twe_test -d twe_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
