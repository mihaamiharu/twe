name: Workflow policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: workflow-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund
      - name: Install verified workflow linter
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Check backup boundary and workflow syntax
        env:
          TWE_ACTIONLINT_BINARY: ${{ runner.temp }}/actionlint
          TWE_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TWE_POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test .github/scripts/workflow-policy.test.mjs
          node .github/scripts/workflow-policy.mjs
