name: Private backup handoff

on:
  workflow_dispatch:

permissions: {}

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Open the owner-controlled recovery vault
        run: |
          {
            echo 'D1 recovery backups run in the private mihaamiharu/twe-backups repository.'
            echo 'Use its default-branch workflow with the exact approved tooling SHA.'
            echo 'This public workflow performs no exports and uploads no recovery archives.'
          } >> "$GITHUB_STEP_SUMMARY"
