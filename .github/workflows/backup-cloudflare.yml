name: Encrypted D1 recovery backup
on:
  schedule:
    - cron: '15 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-recovery-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.TWE_BACKUPS_ENABLED == 'true'
    environment: cloudflare-backups
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      TWE_BACKUP_KEY: ${{ secrets.TWE_BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: mkdir -p .wrangler/encrypted-backup
      - run: bun scripts/backup-d1.ts backup production .wrangler/encrypted-backup/database.enc
      - uses: actions/upload-artifact@v4
        with:
          name: twe-d1-encrypted-${{ github.run_id }}
          path: .wrangler/encrypted-backup/database.enc
          retention-days: 30
          if-no-files-found: error
