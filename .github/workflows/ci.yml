name: CI Tests

on:
  push:
    branches: ['main']
    paths-ignore: ['.github/**', 'docs/**', 'eslint.config.js']
  pull_request:
    branches: ['main']
    paths-ignore: ['.github/**', 'docs/**', 'eslint.config.js']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint -- --max-warnings 0

      - name: Run TypeScript
        run: bun run typecheck

      - name: Run production build
        run: bun run build

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun run test:unit --coverage --coverage-reporter=lcov --coverage-dir=./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run isolated E2E tests
        run: bun run test:e2e

      - name: Upload E2E diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-diagnostics
          path: |
            playwright-report/
            test-results/
            allure-results/
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: Required CI
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, unit, integration, e2e]
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      E2E_RESULT: ${{ needs.e2e.result }}

    steps:
      - name: Verify required jobs
        run: |
          if [[ "$QUALITY_RESULT" != "success" || \
                "$UNIT_RESULT" != "success" || \
                "$INTEGRATION_RESULT" != "success" || \
                "$E2E_RESULT" != "success" ]]; then
            echo "One or more required CI jobs did not pass."
            exit 1
          fi
