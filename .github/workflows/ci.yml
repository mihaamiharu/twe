name: CI Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint -- --max-warnings 0

      - name: Run TypeScript
        run: bun run typecheck

      - name: Run production build
        run: bun run build

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun run test:unit --coverage --coverage-reporter=lcov --coverage-dir=./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://twe_test:twe_password@localhost:5433/twe_test
      TEST_DATABASE_URL: postgresql://twe_test:twe_password@localhost:5433/twe_test
      DIRECT_URL: postgresql://twe_test:twe_password@localhost:5433/twe_test
      BETTER_AUTH_SECRET: dummy_secret_for_ci_tests_1234567890
      BETTER_AUTH_URL: http://localhost:3000
      REQUIRE_EMAIL_VERIFICATION: 'false'
      GOOGLE_CLIENT_ID: dummy_google_client_id
      GOOGLE_CLIENT_SECRET: dummy_google_client_secret

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: twe_test
          POSTGRES_PASSWORD: twe_password
          POSTGRES_DB: twe_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run integration tests
        run: bun run test:integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_CONTAINER_RUNTIME: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run isolated E2E tests
        run: bun run test:e2e

      - name: Upload E2E diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-diagnostics
          path: |
            playwright-report/
            test-results/
            allure-results/
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: Required CI
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, unit, integration, e2e]
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      E2E_RESULT: ${{ needs.e2e.result }}

    steps:
      - name: Verify required jobs
        run: |
          if [[ "$QUALITY_RESULT" != "success" || \
                "$UNIT_RESULT" != "success" || \
                "$INTEGRATION_RESULT" != "success" || \
                "$E2E_RESULT" != "success" ]]; then
            echo "One or more required CI jobs did not pass."
            exit 1
          fi

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
