<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title description">
  <title id="title">Debug test failures with an evidence loop</title>
  <desc id="description">A vertical investigation moves from the observed symptom to the first meaningful failure, competing hypotheses, evidence that distinguishes them, root cause and targeted repair, and verification under the original exposing conditions. A return arrow says to update the hypothesis rather than mask the symptom if the failure remains.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65f3a" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#25231f" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="1078" rx="22" fill="#f7f4ee" stroke="#d9d2c7" stroke-width="2" />
  <text x="48" y="58" fill="#25231f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.2">DEBUG WITH AN EVIDENCE LOOP</text>
  <line x1="48" y1="82" x2="712" y2="82" stroke="#d9d2c7" stroke-width="2" />

  <g filter="url(#shadow)">
    <rect x="104" y="118" width="552" height="104" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
  </g>
  <circle cx="144" cy="170" r="22" fill="#e65f3a" />
  <text x="144" y="177" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">1</text>
  <text x="184" y="158" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">OBSERVED SYMPTOM</text>
  <text x="184" y="191" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">What failed—and under which conditions?</text>

  <line x1="380" y1="234" x2="380" y2="270" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="104" y="284" width="552" height="104" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
  </g>
  <circle cx="144" cy="336" r="22" fill="#e65f3a" />
  <text x="144" y="343" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">2</text>
  <text x="184" y="324" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">FIRST MEANINGFUL FAILURE</text>
  <text x="184" y="357" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Find the earliest broken product assumption.</text>

  <line x1="380" y1="400" x2="380" y2="436" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="104" y="450" width="552" height="118" rx="16" fill="#fff7dd" stroke="#e3b13f" stroke-width="2" />
  </g>
  <circle cx="144" cy="509" r="22" fill="#b38323" />
  <text x="144" y="516" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">3</text>
  <text x="184" y="490" fill="#6d5418" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">COMPETING HYPOTHESES</text>
  <text x="184" y="523" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Locator? Timing? Data? Product? Environment?</text>
  <text x="184" y="549" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Keep more than one explanation alive.</text>

  <line x1="380" y1="580" x2="380" y2="616" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="104" y="630" width="552" height="118" rx="16" fill="#e6f2ec" stroke="#75a38b" stroke-width="2" />
  </g>
  <circle cx="144" cy="689" r="22" fill="#387357" />
  <text x="144" y="696" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">4</text>
  <text x="184" y="670" fill="#2d6249" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">DISTINGUISHING EVIDENCE</text>
  <text x="184" y="703" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Error · DOM · action log · console · network</text>
  <text x="184" y="729" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Use the artifact that can eliminate alternatives.</text>

  <line x1="380" y1="760" x2="380" y2="796" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="104" y="810" width="552" height="104" rx="16" fill="#25231f" />
  </g>
  <circle cx="144" cy="862" r="22" fill="#f4bd4f" />
  <text x="144" y="869" fill="#25231f" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">5</text>
  <text x="184" y="850" fill="#f4bd4f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">ROOT CAUSE → TARGETED REPAIR</text>
  <text x="184" y="879" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Change the broken assumption.</text>
  <text x="184" y="903" fill="#d9d2c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Do not patch the symptom.</text>

  <line x1="380" y1="926" x2="380" y2="954" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="104" y="968" width="552" height="72" rx="16" fill="#fce8e1" stroke="#e65f3a" stroke-width="2" />
  </g>
  <text x="380" y="995" fill="#9b3e27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">VERIFY UNDER THE EXPOSING CONDITIONS</text>
  <text x="380" y="1022" fill="#25231f" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Repeat with the same worker, data, and environment pressure.</text>

  <text x="380" y="1061" fill="#25231f" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">FAILS AGAIN? UPDATE THE HYPOTHESIS—DON’T MASK THE SIGNAL.</text>
</svg>
