<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" role="img" aria-labelledby="title description">
  <title id="title">Choose the smallest useful test abstraction</title>
  <desc id="description">A decision ladder starts with observed change pressure. Clear inline code is appropriate without a stable repeated pattern. A focused helper fits one repeated meaningful action, a component object fits a repeated UI region, and a page object fits a stable application surface with several related capabilities. Scenario risk and evidence remain visible at every level.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65f3a" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#25231f" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="1038" rx="22" fill="#f7f4ee" stroke="#d9d2c7" stroke-width="2" />
  <text x="48" y="58" fill="#25231f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.1">CHOOSE THE SMALLEST USEFUL BOUNDARY</text>
  <line x1="48" y1="82" x2="712" y2="82" stroke="#d9d2c7" stroke-width="2" />

  <g filter="url(#shadow)">
    <rect x="78" y="118" width="604" height="96" rx="18" fill="#25231f" />
  </g>
  <text x="380" y="151" fill="#f4bd4f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">START WITH EVIDENCE</text>
  <text x="380" y="184" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">What meaningful change keeps repeating?</text>

  <line x1="380" y1="226" x2="380" y2="258" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="64" y="272" width="632" height="130" rx="18" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
  </g>
  <circle cx="110" cy="337" r="24" fill="#686258" />
  <text x="110" y="344" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">1</text>
  <text x="152" y="314" fill="#686258" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">NO STABLE PATTERN YET</text>
  <text x="152" y="345" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Keep clear mechanics inline</text>
  <text x="152" y="374" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">A little duplication is evidence—not an emergency.</text>

  <line x1="380" y1="414" x2="380" y2="446" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />
  <text x="405" y="436" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">ONE ACTION REPEATS</text>

  <g filter="url(#shadow)">
    <rect x="64" y="460" width="632" height="130" rx="18" fill="#fff7dd" stroke="#e3b13f" stroke-width="2" />
  </g>
  <circle cx="110" cy="525" r="24" fill="#b38323" />
  <text x="110" y="532" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">2</text>
  <text x="152" y="502" fill="#6d5418" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">FOCUSED HELPER</text>
  <text x="152" y="533" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Name one complete behavior</text>
  <text x="152" y="562" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Example: submitLogin(page, credentials)</text>

  <line x1="380" y1="602" x2="380" y2="634" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />
  <text x="405" y="624" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">ONE UI REGION REPEATS</text>

  <g filter="url(#shadow)">
    <rect x="64" y="648" width="632" height="130" rx="18" fill="#e6f2ec" stroke="#75a38b" stroke-width="2" />
  </g>
  <circle cx="110" cy="713" r="24" fill="#387357" />
  <text x="110" y="720" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">3</text>
  <text x="152" y="690" fill="#2d6249" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">COMPONENT OBJECT</text>
  <text x="152" y="721" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Own one reusable widget boundary</text>
  <text x="152" y="750" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Cart panel · dialog · menu · data grid</text>

  <line x1="380" y1="790" x2="380" y2="822" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />
  <text x="405" y="812" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">RELATED CAPABILITIES STABILIZE</text>

  <g filter="url(#shadow)">
    <rect x="64" y="836" width="632" height="130" rx="18" fill="#fce8e1" stroke="#e65f3a" stroke-width="2" />
  </g>
  <circle cx="110" cy="901" r="24" fill="#e65f3a" />
  <text x="110" y="908" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">4</text>
  <text x="152" y="878" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">PAGE OBJECT</text>
  <text x="152" y="909" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Expose a coherent application surface</text>
  <text x="152" y="938" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Use product vocabulary—not generic click/fill wrappers.</text>

  <rect x="80" y="984" width="600" height="34" rx="17" fill="#25231f" />
  <text x="380" y="1007" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">EVERY LEVEL: KEEP SCENARIO RISK + EVIDENCE VISIBLE</text>
</svg>
