<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" role="img" aria-labelledby="title description">
  <title id="title">Scope repeated UI before acting</title>
  <desc id="description">Three product cards each contain an Add to Cart button. A broad button locator matches three controls and fails a strict action. Filtering cards by the exact Widget Pro heading and In Stock state leaves one card, so the button inside it has one intended match. Choosing first is shown as hiding ambiguity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65f3a" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#25231f" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="1118" rx="22" fill="#f7f4ee" stroke="#d9d2c7" stroke-width="2" />
  <text x="48" y="58" fill="#25231f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.4">STRICTNESS EXPOSES AMBIGUITY</text>
  <line x1="48" y1="82" x2="712" y2="82" stroke="#d9d2c7" stroke-width="2" />

  <text x="70" y="126" fill="#e65f3a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1">REPEATED PRODUCT UI</text>
  <g filter="url(#shadow)">
    <rect x="70" y="148" width="620" height="300" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
  </g>

  <rect x="94" y="182" width="174" height="220" rx="13" fill="#f7f4ee" stroke="#9b9488" stroke-width="2" />
  <text x="112" y="219" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Widget Basic</text>
  <text x="112" y="254" fill="#9b3e27" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Out of Stock</text>
  <rect x="112" y="302" width="138" height="44" rx="9" fill="#ffffff" stroke="#9b9488" stroke-width="2" />
  <text x="181" y="330" fill="#686258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Add to Cart</text>

  <rect x="293" y="174" width="174" height="236" rx="13" fill="#fce8e1" stroke="#e65f3a" stroke-width="3" />
  <text x="311" y="211" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Widget Pro</text>
  <text x="311" y="246" fill="#387357" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">In Stock</text>
  <rect x="311" y="294" width="138" height="44" rx="9" fill="#e65f3a" />
  <text x="380" y="322" fill="#ffffff" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Add to Cart</text>
  <text x="380" y="381" fill="#9b3e27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">INTENDED CARD</text>

  <rect x="492" y="182" width="174" height="220" rx="13" fill="#f7f4ee" stroke="#9b9488" stroke-width="2" />
  <text x="510" y="219" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Widget Pro Max</text>
  <text x="510" y="254" fill="#9b3e27" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Out of Stock</text>
  <rect x="510" y="302" width="138" height="44" rx="9" fill="#ffffff" stroke="#9b9488" stroke-width="2" />
  <text x="579" y="330" fill="#686258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Add to Cart</text>

  <line x1="380" y1="462" x2="380" y2="500" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="70" y="516" width="620" height="188" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
  </g>
  <text x="96" y="552" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700">BROAD ACTION LOCATOR</text>
  <rect x="96" y="574" width="568" height="50" rx="10" fill="#25231f" />
  <text x="116" y="606" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">getByRole('button', { name: 'Add to Cart' })</text>
  <text x="96" y="659" fill="#9b3e27" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">3 matches → strict click fails with useful evidence</text>
  <text x="96" y="684" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">The test has not yet explained which product it means.</text>

  <line x1="380" y1="718" x2="380" y2="756" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="70" y="772" width="620" height="188" rx="16" fill="#e6f2ec" stroke="#75a38b" stroke-width="2" />
  </g>
  <text x="96" y="808" fill="#2d6249" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700">IDENTITY → STATE → ACTION IN SCOPE</text>
  <text x="96" y="847" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">1. Filter article by exact “Widget Pro” heading</text>
  <text x="96" y="880" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">2. Filter that card by exact “In Stock” text</text>
  <text x="96" y="913" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">3. Click “Add to Cart” inside the one card</text>
  <text x="96" y="944" fill="#387357" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">1 match → action has an explainable target ✓</text>

  <rect x="128" y="992" width="504" height="56" rx="12" fill="#fff7dd" stroke="#e3b13f" stroke-width="2" />
  <text x="380" y="1016" fill="#6d5418" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">first() DOES NOT CREATE IDENTITY</text>
  <text x="380" y="1038" fill="#6d5418" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">It only chooses one current match and hides the ambiguity.</text>

  <text x="380" y="1084" fill="#25231f" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">SCOPE BY MEANING · PROVE UNIQUENESS · THEN ACT</text>
</svg>
