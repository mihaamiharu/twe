<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title description">
  <title id="title">Automation intent chain</title>
  <desc id="description">Four connected steps: risk to detect, known starting state and data, user action, and observable evidence. If any step is unclear, investigate before automating.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65f3a" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#25231f" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="1078" rx="22" fill="#f7f4ee" stroke="#d9d2c7" stroke-width="2" />

  <text x="48" y="58" fill="#25231f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.7">FROM TEST IDEA TO AUTOMATION INTENT</text>
  <line x1="48" y1="82" x2="712" y2="82" stroke="#d9d2c7" stroke-width="2" />

  <g filter="url(#shadow)">
    <rect x="70" y="116" width="620" height="164" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
    <circle cx="112" cy="158" r="22" fill="#e65f3a" />
    <text x="112" y="166" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">1</text>
    <text x="154" y="169" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700">Risk to detect</text>
    <text x="154" y="215" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">What meaningful failure are we trying to detect?</text>
  </g>

  <line x1="380" y1="292" x2="380" y2="328" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="70" y="342" width="620" height="164" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
    <circle cx="112" cy="384" r="22" fill="#e65f3a" />
    <text x="112" y="392" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">2</text>
    <text x="154" y="395" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700">Known starting state and data</text>
    <text x="154" y="441" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">What must already be true for a repeatable check?</text>
  </g>

  <line x1="380" y1="518" x2="380" y2="554" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="70" y="568" width="620" height="164" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
    <circle cx="112" cy="610" r="22" fill="#e65f3a" />
    <text x="112" y="618" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">3</text>
    <text x="154" y="621" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700">User action</text>
    <text x="154" y="667" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">What does the user do to trigger the behavior?</text>
  </g>

  <line x1="380" y1="744" x2="380" y2="780" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="70" y="794" width="620" height="164" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
    <circle cx="112" cy="836" r="22" fill="#e65f3a" />
    <text x="112" y="844" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">4</text>
    <text x="154" y="847" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700">Observable evidence</text>
    <text x="154" y="893" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">What proves the expected business outcome?</text>
  </g>

  <rect x="70" y="990" width="620" height="54" rx="12" fill="#fce8e1" stroke="#e65f3a" stroke-width="1.5" />
  <text x="380" y="1023" fill="#9b3e27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="0.7">UNCLEAR AT ANY STEP? INVESTIGATE BEFORE AUTOMATING.</text>
</svg>
