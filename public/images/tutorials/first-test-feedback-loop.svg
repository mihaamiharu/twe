<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" role="img" aria-labelledby="title description">
  <title id="title">A focused Playwright test feedback loop</title>
  <desc id="description">QA intent becomes one focused test. The test drives browser behavior and observes evidence. The runner reports a pass or a diagnostic failure. A failure sends QA back to inspect assumptions and refine the contract.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65f3a" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#25231f" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="1118" rx="22" fill="#f7f4ee" stroke="#d9d2c7" stroke-width="2" />
  <text x="48" y="58" fill="#25231f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5">ONE TEST · ONE EXPLAINABLE FEEDBACK LOOP</text>
  <line x1="48" y1="82" x2="712" y2="82" stroke="#d9d2c7" stroke-width="2" />

  <g filter="url(#shadow)">
    <rect x="80" y="118" width="600" height="140" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
    <circle cx="124" cy="160" r="22" fill="#e65f3a" />
    <text x="124" y="168" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700">1</text>
    <text x="166" y="170" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">QA intent</text>
    <text x="166" y="214" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Which product risk should this scenario detect?</text>
  </g>

  <line x1="380" y1="270" x2="380" y2="306" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="80" y="320" width="600" height="160" rx="16" fill="#25231f" />
    <circle cx="124" cy="362" r="22" fill="#f4bd4f" />
    <text x="124" y="370" fill="#25231f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700">2</text>
    <text x="166" y="372" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Focused test contract</text>
    <text x="166" y="416" fill="#d9d2c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Known state · user action · assertion</text>
    <text x="166" y="451" fill="#f4bd4f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700">TEST + PAGE + LOCATOR + EXPECT</text>
  </g>

  <line x1="380" y1="492" x2="380" y2="528" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="80" y="542" width="600" height="140" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
    <circle cx="124" cy="584" r="22" fill="#e65f3a" />
    <text x="124" y="592" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700">3</text>
    <text x="166" y="594" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Browser behavior</text>
    <text x="166" y="638" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">The runner drives one isolated scenario.</text>
  </g>

  <line x1="380" y1="694" x2="380" y2="730" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="80" y="744" width="600" height="140" rx="16" fill="#ffffff" stroke="#d9d2c7" stroke-width="2" />
    <circle cx="124" cy="786" r="22" fill="#e65f3a" />
    <text x="124" y="794" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700">4</text>
    <text x="166" y="796" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Observable evidence</text>
    <text x="166" y="840" fill="#686258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Does the assertion prove the intended outcome?</text>
  </g>

  <line x1="380" y1="896" x2="380" y2="932" stroke="#e65f3a" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="80" y="946" width="600" height="112" rx="16" fill="#fce8e1" stroke="#e65f3a" stroke-width="2" />
    <text x="110" y="985" fill="#9b3e27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1">RUNNER RESULT</text>
    <text x="110" y="1027" fill="#25231f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">PASS — or a failure you can investigate</text>
  </g>

  <path d="M72 1002 H38 V190 H66" fill="none" stroke="#9b9488" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)" />
  <text x="27" y="620" fill="#686258" text-anchor="middle" transform="rotate(-90 27 620)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">INSPECT ASSUMPTIONS · REFINE THE CONTRACT</text>
</svg>
